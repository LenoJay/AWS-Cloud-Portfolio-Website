<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog • Lenkov</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <!-- Terminal window: wraps the whole page -->
  <div class="term">

  <!-- Terminal title bar (sticky header) -->
  <header class="site-header">
    <div class="term-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <a href="/" class="term-prompt">leno@lenojay<span class="muted">:</span><span class="accent">~/blog</span></a>
    <nav class="term-nav" aria-label="Main">
      <a href="/#about">~/about</a>
      <a href="/#projects">~/projects</a>
      <a href="/#skills">~/skills</a>
      <a href="/#certifications">~/certs</a>
      <a href="/blog/index.html" aria-current="page">~/blog</a>
      <a href="/#contact">~/contact</a>
    </nav>
  </header>

  <main id="main" class="container">
    <section class="hero" style="padding-top:32px;">
      <div class="hero-content reveal">
        <p class="cmd">$ blog --all</p>
        <h1 style="margin:0;">Blog</h1>
        <p class="subhead">Posts about AWS builds, decisions, and lessons learned.</p>
      </div>
    </section>

    <section class="section">
      <div class="blog-grid reveal" id="blogGrid"></div>
    </section>
  </main>

  <!-- Status bar footer (Vim style) -->
  <footer class="status-bar">
    <span class="sb-mode">NORMAL</span>
    <span class="sb-branch">main</span>
    <span class="sb-info">lenojay.com · built on S3 + CloudFront · deployed by GitHub Actions</span>
    <span class="sb-meta">utf-8 · © <span id="year">2026</span></span>
  </footer>
  </div>

  <script src="/js/main.js" defer></script>
</body>
</html>
